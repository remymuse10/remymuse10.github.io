<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tır Asistanı</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --text:#f0f3f6; --muted:#9aa7b4;
    --accent:#f5a623; --danger:#e53935; --ok:#2e9e5b; --border:#2a3342;
    --map-filter:none;
  }
  body.light{
    --bg:#f4f5f7; --panel:#ffffff; --panel2:#eceff3; --text:#14181d; --muted:#5c6672;
    --accent:#d98a06; --danger:#d32f2f; --ok:#1f7a44; --border:#d4dae1;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  #map{position:absolute;inset:0;z-index:1;filter:var(--map-filter)}
  body:not(.light) #map{--map-filter:invert(0.92) hue-rotate(185deg) brightness(0.92) contrast(0.95)}

  /* Üst hız paneli */
  #hud{position:absolute;top:0;left:0;right:0;z-index:500;display:flex;align-items:stretch;gap:8px;padding:10px;
       background:linear-gradient(180deg,rgba(0,0,0,.45),transparent);pointer-events:none}
  body.light #hud{background:linear-gradient(180deg,rgba(255,255,255,.65),transparent)}
  #hud>*{pointer-events:auto}
  #speedBox{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:16px;
            display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;min-width:0}
  #speedVal{font-size:52px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  #speedUnit{font-size:13px;color:var(--muted);letter-spacing:.12em}
  #roadName{font-size:12px;color:var(--muted);margin-top:3px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #limitBox{width:96px;background:var(--panel);border:1px solid var(--border);border-radius:16px;
            display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px}
  #limitSign{width:56px;height:56px;border-radius:50%;background:#fff;border:7px solid var(--danger);
             color:#111;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
  #limitLbl{font-size:11px;color:var(--muted);text-align:center;line-height:1.25}
  #speedBox.over #speedVal{color:var(--danger);animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #limitBox small{color:var(--muted);font-size:10px}

  /* Kayıt çubuğu */
  #recBar{position:absolute;top:118px;left:50%;transform:translateX(-50%);z-index:600;display:none;
          background:var(--danger);color:#fff;border-radius:999px;padding:10px 18px;font-size:17px;font-weight:700;
          align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #recBar.on{display:flex}
  #recDot{width:12px;height:12px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}

  /* Süre seçim çipleri */
  #durBar{position:absolute;left:0;right:0;bottom:118px;z-index:500;display:flex;justify-content:center;gap:6px;padding:0 10px}
  .chip{background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:999px;
        padding:9px 13px;font-size:14px;font-weight:600;cursor:pointer}
  .chip.sel{background:var(--accent);color:#111;border-color:var(--accent)}
  #durLbl{position:absolute;left:0;right:0;bottom:158px;z-index:500;text-align:center;font-size:12px;color:var(--muted);
          text-shadow:0 1px 3px rgba(0,0,0,.5)}

  /* Alt düğmeler */
  #dock{position:absolute;left:0;right:0;bottom:0;z-index:500;background:var(--panel);border-top:1px solid var(--border);
        display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .btn{border:none;border-radius:16px;padding:16px 6px;font-size:17px;font-weight:800;cursor:pointer;color:#fff;
       display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15}
  .btn .ico{font-size:26px}
  .btn small{font-weight:600;font-size:12px;opacity:.85}
  #btnAcc{background:var(--danger)}
  #btnRest{background:var(--ok)}
  #btnVoice{background:#31517d}
  body.light #btnVoice{background:#2f6db3}
  .btn:active{transform:scale(.97)}

  /* Köşe düğmeleri */
  .fab{position:absolute;z-index:550;width:52px;height:52px;border-radius:50%;border:1px solid var(--border);
       background:var(--panel);color:var(--text);font-size:23px;cursor:pointer;display:flex;align-items:center;justify-content:center;
       box-shadow:0 4px 14px rgba(0,0,0,.3)}
  #btnCenter{right:12px;bottom:236px}
  #btnTheme{right:12px;bottom:298px}
  #btnList{right:12px;bottom:360px}
  #listBadge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:12px;font-weight:700;
             min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}

  /* Liste paneli */
  #panel{position:absolute;top:0;right:0;bottom:0;width:min(360px,92vw);z-index:800;background:var(--panel);
         border-left:1px solid var(--border);transform:translateX(105%);transition:transform .25s;display:flex;flex-direction:column}
  #panel.open{transform:none}
  #panelHead{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border)}
  #panelHead b{font-size:18px}
  #btnClose{background:var(--panel2);border:none;color:var(--text);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer}
  #markList{flex:1;overflow-y:auto;padding:10px}
  .mark{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
  .mark .t{font-weight:800;font-size:16px}
  .mark .m{color:var(--muted);font-size:13px;margin-top:2px}
  .mark .row{display:flex;gap:8px;margin-top:10px}
  .mark button{flex:1;border:none;border-radius:10px;padding:11px;font-size:15px;font-weight:700;cursor:pointer}
  .playBtn{background:var(--accent);color:#111}
  .goBtn{background:#31517d;color:#fff}
  .delBtn{background:transparent;color:var(--danger);border:1px solid var(--danger)!important;flex:0 0 64px!important}
  .empty{color:var(--muted);text-align:center;padding:32px 10px;font-size:15px;line-height:1.6}

  /* Kayıt ipucu */
  #toast{position:absolute;left:50%;bottom:210px;transform:translateX(-50%);z-index:900;background:#111;color:#fff;
         padding:11px 16px;border-radius:12px;font-size:15px;display:none;max-width:88vw;text-align:center}
  #toast.on{display:block}

  .mkIcon{display:flex;align-items:center;justify-content:center;border-radius:50%;border:3px solid #fff;
          box-shadow:0 3px 10px rgba(0,0,0,.45);font-size:19px;width:40px;height:40px}
  .leaflet-container{font:inherit}

  /* Araç seçim ekranı */
  #vehicleScreen{position:absolute;inset:0;z-index:1000;background:var(--bg);display:none;
                 flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:14px}
  #vehicleScreen.on{display:flex}
  #vehicleScreen h1{font-size:26px;text-align:center}
  #vehicleScreen p{color:var(--muted);text-align:center;font-size:15px;line-height:1.5;max-width:340px}
  .vGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px;margin-top:8px}
  .vCard{background:var(--panel);border:2px solid var(--border);border-radius:18px;padding:18px 8px;cursor:pointer;
         display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px;font-weight:700;color:var(--text)}
  .vCard .ico{font-size:38px}
  .vCard.sel{border-color:var(--accent)}
  .vCard:active{transform:scale(.97)}
</style>
</head>
<body>
<div id="vehicleScreen">
  <h1>🚦 Aracını Seç</h1>
  <p>Hız sınırları araca göre değişir. Seçtiğin araca göre limit ve uyarılar ayarlanır; sonra istediğin an değiştirebilirsin.</p>
  <div class="vGrid" id="vGrid"></div>
</div>

<div id="map"></div>

<div id="hud">
  <div id="speedBox">
    <div id="speedVal">--</div>
    <div id="speedUnit">KM/S</div>
    <div id="roadName">Konum bekleniyor…</div>
  </div>
  <div id="limitBox" title="Aracı değiştirmek için dokun">
    <div id="limitSign">?</div>
    <div id="limitLbl">HIZ LİMİTİ</div>
  </div>
</div>

<div id="recBar"><span id="recDot"></span><span id="recTxt">Kaydediliyor 0:00 — durdurmak için düğmeye tekrar bas</span></div>
<div id="toast"></div>

<div id="durLbl">Ses notu kalıcılık süresi (süre dolunca otomatik silinir)</div>
<div id="durBar">
  <button class="chip" data-min="30">30 dk</button>
  <button class="chip sel" data-min="60">1 saat</button>
  <button class="chip" data-min="120">2 saat</button>
  <button class="chip" data-min="180">3 saat</button>
</div>

<button class="fab" id="btnList">🗂<span id="listBadge" style="display:none">0</span></button>
<button class="fab" id="btnTheme" title="Açık / koyu tema">☀️</button>
<button class="fab" id="btnCenter" title="Konumumu ortala">🎯</button>

<div id="dock">
  <button class="btn" id="btnAcc"><span class="ico">⚠️</span>KAZA<small>bas, konuş, bırak</small></button>
  <button class="btn" id="btnVoice"><span class="ico">🎙️</span>SES NOTU<small>bas, konuş, bırak</small></button>
  <button class="btn" id="btnRest"><span class="ico">☕</span>MOLA<small>bas, konuş, bırak</small></button>
</div>

<aside id="panel">
  <div id="panelHead"><b>Yol Notları</b><button id="btnClose">✕</button></div>
  <div id="markList"></div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
/* ============ Tır Asistanı — Aşama 1 (yerel sürüm) ============
   Harita: varsayılan OpenStreetMap (anahtarsız). Yandex anahtarı girilirse
   harita Yandex'e geçer — YANDEX_API_KEY'i doldurmak yeterli.
   Hız limiti: OpenStreetMap (Overpass) maxspeed verisi + Türkiye kamyon
   tavanları (yerleşim 50 / tek yönlü şehirlerarası 80 / bölünmüş 85 / otoyol 90). */
const YANDEX_API_KEY = ""; // <-- Yandex anahtarı buraya (boş = OSM haritası)
const SUNUCU_URL = "";     // <-- Ortak sunucu adresi (örn. https://sunucu.ornek.com) — boş = yalnız yerel mod
const PB_KOLEKSIYON = "isaretler";

/* Araçlar ve Türkiye hız sınırı tavanları (km/s)
   Sıra: yerleşim tipi yollar / tek yönlü şehirlerarası / bölünmüş / otoyol.
   OSM'deki yol sınırı (otomobil içindir), aracın tavanıyla kırpılır. */
const ARACLAR = {
  otomobil:  {ad:"Otomobil",  ikon:"🚗", tavan:{motorway:120,trunk:110,primary:90,secondary:90,tertiary:90,unclassified:50,residential:50,living_street:20,service:20}},
  motosiklet:{ad:"Motosiklet",ikon:"🏍️", tavan:{motorway:100,trunk:90, primary:80,secondary:80,tertiary:80,unclassified:50,residential:50,living_street:20,service:20}},
  kamyon:    {ad:"Kamyon / Tır", ikon:"🚛", tavan:{motorway:90, trunk:85, primary:80,secondary:80,tertiary:80,unclassified:50,residential:50,living_street:20,service:20}},
  otobus:    {ad:"Otobüs",    ikon:"🚌", tavan:{motorway:100,trunk:90, primary:80,secondary:80,tertiary:80,unclassified:50,residential:50,living_street:20,service:20}},
  bisiklet:  {ad:"Bisiklet",  ikon:"🚲", tavan:{motorway:0,  trunk:0,  primary:30,secondary:30,tertiary:30,unclassified:30,residential:30,living_street:20,service:20}}
};

/* ---------- Yardımcılar ---------- */
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem("tir_"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("tir_"+k, JSON.stringify(v)); }catch(e){} }
};
let arac = store.get("arac", null);
function toast(msg, ms=2600){
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("on"), ms);
}
function haversine(a,b,c,d){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(c-a), dLon=toR(d-b);
  const s=Math.sin(dLat/2)**2 + Math.cos(toR(a))*Math.cos(toR(c))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

/* ---------- Ses saklama (IndexedDB) ---------- */
const idb = {
  db:null,
  open(){ return new Promise((res,rej)=>{
    const r = indexedDB.open("tir-asistani",1);
    r.onupgradeneeded = ()=> r.result.createObjectStore("sesler");
    r.onsuccess = ()=>{ idb.db = r.result; res(); };
    r.onerror = ()=> rej(r.error);
  });},
  put(id, blob){ return new Promise((res,rej)=>{
    const t = idb.db.transaction("sesler","readwrite");
    t.objectStore("sesler").put(blob, id);
    t.oncomplete = res; t.onerror = ()=>rej(t.error);
  });},
  get(id){ return new Promise((res,rej)=>{
    const t = idb.db.transaction("sesler","readonly");
    const q = t.objectStore("sesler").get(id);
    q.onsuccess = ()=>res(q.result||null); q.onerror = ()=>rej(q.error);
  });},
  del(id){ return new Promise(res=>{
    if(!idb.db) return res();
    const t = idb.db.transaction("sesler","readwrite");
    t.objectStore("sesler").delete(id);
    t.oncomplete = res; t.onerror = res;
  });}
};

/* ---------- Durum ---------- */
let pos = null;              // {lat, lon}
let speedKmh = 0;
let roadLimit = null;        // bulunan limit (km/s)
let lastLimitFetch = 0, lastFetchPos = null;
let marks = store.get("isaretler", []);   // {id, tip, lat, lon, zaman, bitis, sesVar}
let durMin = store.get("sure_dk", 60);
let map, myMarker, leafletMarks = {}, yandexMarks = {}, useYandex = false;
let audioCtx = null, lastBeep = 0;
let sunucuSesURL = {};   // sunucu işareti id -> ses dosyası URL'si
let recPos = null;       // kayıt BAŞLANGIÇ konumu (işaret buraya sabitlenir)
let calan = null;        // {id, audio} — tek tık çal/durdur için
let kameralar = [];      // {lat, lon, uyariVerildi}
let camLayer = null, lastCamFetch = 0, lastCamPos = null;

/* ---------- Harita ---------- */
function initOSM(){
  map = L.map("map", {zoomControl:false, attributionControl:false}).setView([39.6, 27.0], 7);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19}).addTo(map);
  myMarker = L.circleMarker([39.6,27.0], {radius:9, color:"#fff", weight:3, fillColor:"#1976d2", fillOpacity:1}).addTo(map);
}
function initYandex(){
  return new Promise(res=>{
    const s = document.createElement("script");
    s.src = "https://api-maps.yandex.ru/2.1/?lang=tr_TR&apikey=" + encodeURIComponent(YANDEX_API_KEY);
    s.onload = ()=> ymaps.ready(()=>{
      try{
        map = new ymaps.Map("map", {center:[pos?pos.lat:39.6, pos?pos.lon:27.0], zoom:15, controls:[]});
        myMarker = new ymaps.Placemark([39.6,27.0], {}, {preset:"islands#blueCircleDotIcon"});
        map.geoObjects.add(myMarker);
        useYandex = true; res(true);
      }catch(e){ res(false); }
    });
    s.onerror = ()=> res(false);
    document.head.appendChild(s);
  });
}
function mapSetView(lat, lon, zoom){
  if(useYandex){ map.setCenter([lat,lon], zoom || map.getZoom()); }
  else{ map.setView([lat,lon], zoom || map.getZoom()); }
}
function mapMoveMarker(lat, lon){
  if(useYandex){ myMarker.geometry.setCoordinates([lat,lon]); }
  else{ myMarker.setLatLng([lat,lon]); }
}
const TIP_BILGI = {
  kaza:  {ad:"Kaza",      ikon:"⚠️", renk:"#e53935"},
  ses:   {ad:"Ses notu",  ikon:"🎙️", renk:"#31517d"},
  mola:  {ad:"Mola yeri", ikon:"☕", renk:"#2e9e5b"}
};
function haritayaIsaret(m){
  const b = TIP_BILGI[m.tip];
  if(useYandex){
    const pm = new ymaps.Placemark([m.lat,m.lon], {}, {
      iconLayout:"default#imageWithContent", iconImageHref: svgPin(b.renk, b.ikon),
      iconImageSize:[40,40], iconImageOffset:[-20,-20]});
    pm.events.add("click", ()=> sesToggle(m));
    map.geoObjects.add(pm); yandexMarks[m.id] = pm;
  }else{
    const ic = L.divIcon({className:"", html:`<div class="mkIcon" style="background:${b.renk}">${b.ikon}</div>`,
                          iconSize:[40,40], iconAnchor:[20,20]});
    const mk = L.marker([m.lat,m.lon], {icon:ic}).addTo(map);
    mk.on("click", ()=> sesToggle(m));
    leafletMarks[m.id] = mk;
  }
}
function haritadanKaldir(id){
  if(leafletMarks[id]){ map.removeLayer(leafletMarks[id]); delete leafletMarks[id]; }
  if(yandexMarks[id]){ map.geoObjects.remove(yandexMarks[id]); delete yandexMarks[id]; }
}
function svgPin(renk, ikon){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='17' fill='${renk}' stroke='white' stroke-width='3'/><text x='20' y='27' font-size='17' text-anchor='middle'>${ikon}</text></svg>`;
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

/* ---------- Hız limiti (Overpass / OSM) ---------- */
async function limitGetir(lat, lon){
  const q = `[out:json][timeout:8];way(around:30,${lat},${lon})[highway];out tags 1;`;
  try{
    const r = await fetch("https://overpass-api.de/api/interpreter", {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"data=" + encodeURIComponent(q)});
    if(!r.ok) return;
    const j = await r.json();
    if(!j.elements || !j.elements.length) return;
    const t = j.elements[0].tags || {};
    const tip = (t.highway || "").replace(/_link$/,"");
    let lim = null;
    if(t.maxspeed){ const n = parseInt(t.maxspeed,10); if(!isNaN(n)) lim = n; }
    const tavanT = (ARACLAR[arac] || ARACLAR.kamyon).tavan;
    const tavan = tavanT[tip];
    if(tavan === 0){
      roadLimit = null;
      $("#limitSign").textContent = "✕";
      $("#roadName").textContent = (t.name || t.ref || "Bu yol") + " — bu araca kapalı";
      return;
    }
    if(tavan !== undefined) lim = (lim === null) ? tavan : Math.min(lim, tavan);
    roadLimit = lim;
    $("#roadName").textContent = t.name || t.ref || "Adsız yol";
    $("#limitSign").textContent = lim ? lim : "?";
  }catch(e){ /* ağ yoksa son limit korunur */ }
}

/* ---------- GPS ---------- */
function gpsBaslat(){
  if(!("geolocation" in navigator)){ toast("Bu cihazda konum desteği yok."); return; }
  navigator.geolocation.watchPosition(p=>{
    const lat = p.coords.latitude, lon = p.coords.longitude;
    const first = !pos;
    if(p.coords.speed !== null && p.coords.speed >= 0){
      speedKmh = Math.round(p.coords.speed * 3.6);
    }else if(pos){
      const dt = (p.timestamp - (pos._t||p.timestamp)) / 1000;
      if(dt > 0.5){ const d = haversine(pos.lat,pos.lon,lat,lon); speedKmh = Math.round(d/dt*3.6); }
    }
    pos = {lat, lon, _t:p.timestamp};
    if(map){ mapMoveMarker(lat, lon); if(first) mapSetView(lat, lon, 16); }
    $("#speedVal").textContent = speedKmh;
    const now = Date.now();
    if((!lastFetchPos || haversine(lastFetchPos.lat,lastFetchPos.lon,lat,lon) > 120) && now - lastLimitFetch > 15000){
      lastLimitFetch = now; lastFetchPos = {lat, lon};
      limitGetir(lat, lon);
    }
    if(!useYandex && (!lastCamPos || haversine(lastCamPos.lat,lastCamPos.lon,lat,lon) > 5000 || now - lastCamFetch > 300000)){
      lastCamFetch = now; lastCamPos = {lat, lon};
      kameralariGetir(lat, lon);
    }
    kameraKontrol();
    asimKontrol();
  }, err=>{ toast("Konum izni gerekli: " + err.message); },
  {enableHighAccuracy:true, maximumAge:1000, timeout:15000});
}
function asimKontrol(){
  const over = roadLimit && speedKmh > roadLimit * 1.1;
  $("#speedBox").classList.toggle("over", !!over);
  if(over){
    const now = Date.now();
    if(now - lastBeep > 1200){ lastBeep = now; bip(); if(navigator.vibrate) navigator.vibrate(120); }
  }
}
function bip(){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    o.connect(g).connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.4);
  }catch(e){}
}

/* ---------- Ses kaydı ---------- */
let recorder = null, recChunks = [], recTip = null, recStart = 0, recTimer = null;
async function kayitBaslat(tip){
  if(recorder){ kayitDurdur(); return; }
  if(!pos){ toast("Önce konum gelmeli — bir saniye bekleyip tekrar bas."); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("Mikrofon izni gerekli."); return; }
  recChunks = []; recTip = tip; recStart = Date.now();
  recPos = {lat: pos.lat, lon: pos.lon};   // işaret, kayıt başlangıç noktasına yapışır
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = e => { if(e.data.size) recChunks.push(e.data); };
  recorder.onstop = async ()=>{
    stream.getTracks().forEach(t=>t.stop());
    clearInterval(recTimer); $("#recBar").classList.remove("on");
    const blob = new Blob(recChunks, {type: recorder.mimeType || "audio/webm"});
    await isaretKaydet(recTip, blob);
    recorder = null;
  };
  recorder.start();
  $("#recTxt").textContent = `${TIP_BILGI[tip].ad} kaydediliyor 0:00 — durdurmak için düğmeye tekrar bas`;
  $("#recBar").classList.add("on");
  recTimer = setInterval(()=>{
    const s = Math.floor((Date.now()-recStart)/1000);
    $("#recTxt").textContent = `${TIP_BILGI[recTip].ad} kaydediliyor ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} — durdurmak için düğmeye tekrar bas`;
  }, 500);
  if(navigator.vibrate) navigator.vibrate(60);
}
function kayitDurdur(){ if(recorder && recorder.state !== "inactive") recorder.stop(); }

async function isaretKaydet(tip, blob){
  const now = Date.now();
  const kp = recPos || pos;
  const m = { id:"m"+now.toString(36)+Math.floor(Math.random()*999),
    tip, lat:kp.lat, lon:kp.lon, zaman:now, bitis: now + durMin*60000, sesVar:true };
  try{ await idb.put(m.id, blob); }catch(e){ m.sesVar = false; }
  marks.push(m); store.set("isaretler", marks);
  haritayaIsaret(m); listeyiCiz();
  toast(`${TIP_BILGI[tip].ad} bırakıldı · ${durMin>=60 ? (durMin/60)+" saat" : durMin+" dk"} sonra silinir`);
  sunucuyaGonder(m, blob);
}
async function isaretSil(id, sessiz){
  marks = marks.filter(m=>m.id !== id);
  store.set("isaretler", marks);
  haritadanKaldir(id);
  try{ await idb.del(id); }catch(e){}
  listeyiCiz();
  if(!sessiz) toast("Not silindi.");
}
function sureKontrol(){
  const now = Date.now();
  marks.filter(m=>m.bitis <= now).forEach(m=> isaretSil(m.id, true));
}

/* ---------- Ortak sunucu senkronu (Aşama 2) ---------- */
async function sunucuyaGonder(m, blob){
  if(!SUNUCU_URL) return;
  try{
    const fd = new FormData();
    fd.append("tip", m.tip);
    fd.append("lat", m.lat);
    fd.append("lon", m.lon);
    fd.append("bitis", new Date(m.bitis).toISOString().replace("T"," ").slice(0,23)+"Z");
    if(blob) fd.append("ses", blob, "ses.webm");
    const r = await fetch(`${SUNUCU_URL}/api/collections/${PB_KOLEKSIYON}/records`, {method:"POST", body:fd});
    if(r.ok){
      const rec = await r.json();
      m.sunucuId = rec.id;
      if(rec.ses) sunucuSesURL["pb_"+rec.id] = `${SUNUCU_URL}/api/files/${PB_KOLEKSIYON}/${rec.id}/${rec.ses}`;
      store.set("isaretler", marks);
    }
  }catch(e){ /* sunucu yoksa yerel kayıt yeterli */ }
}
async function senkronCek(){
  if(!SUNUCU_URL) return;
  try{
    const simdi = new Date().toISOString().replace("T"," ").slice(0,19);
    const url = `${SUNUCU_URL}/api/collections/${PB_KOLEKSIYON}/records?perPage=200&sort=-created&filter=` +
                encodeURIComponent(`bitis > "${simdi}"`);
    const r = await fetch(url);
    if(!r.ok) return;
    const j = await r.json();
    let degisti = false;
    (j.items||[]).forEach(rec=>{
      const id = "pb_" + rec.id;
      if(marks.some(m=>m.id === id || m.sunucuId === rec.id)) return;
      const m = { id, tip: rec.tip, lat: rec.lat, lon: rec.lon,
                  zaman: new Date(rec.created).getTime(),
                  bitis: new Date(rec.bitis).getTime(), sesVar: !!rec.ses, sunucu: true };
      marks.push(m); haritayaIsaret(m); degisti = true;
      if(rec.ses) sunucuSesURL[id] = `${SUNUCU_URL}/api/files/${PB_KOLEKSIYON}/${rec.id}/${rec.ses}`;
    });
    if(degisti){ store.set("isaretler", marks); listeyiCiz(); }
  }catch(e){ /* sessiz geç */ }
}

/* ---------- Sabit hız kameraları (OSM) ---------- */
async function kameralariGetir(lat, lon){
  const q = `[out:json][timeout:10];node["highway"="speed_camera"](around:12000,${lat},${lon});out body 100;`;
  try{
    const r = await fetch("https://overpass-api.de/api/interpreter", {
      method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:"data=" + encodeURIComponent(q)});
    if(!r.ok) return;
    const j = await r.json();
    kameralar = (j.elements||[]).map(e=>({lat:e.lat, lon:e.lon, uyariVerildi:false}));
    kameraKatmaniniCiz();
  }catch(e){}
}
function kameraKatmaniniCiz(){
  if(useYandex || !map) return;
  if(camLayer) map.removeLayer(camLayer);
  camLayer = L.layerGroup();
  kameralar.forEach(k=>{
    const ic = L.divIcon({className:"", html:`<div class="mkIcon" style="background:#37474f">📸</div>`,
                          iconSize:[40,40], iconAnchor:[20,20]});
    L.marker([k.lat,k.lon], {icon:ic}).addTo(camLayer).bindPopup("<b>Sabit hız kamerası</b>");
  });
  camLayer.addTo(map);
}
function kameraKontrol(){
  if(!pos) return;
  kameralar.forEach(k=>{
    const d = haversine(pos.lat,pos.lon,k.lat,k.lon);
    if(d < 500 && !k.uyariVerildi){
      k.uyariVerildi = true;
      toast("📸 Sabit hız kamerası ~500 m ileride!", 4000);
      bip(); setTimeout(bip, 500);
      if(navigator.vibrate) navigator.vibrate([100,60,100]);
    }
    if(d > 900) k.uyariVerildi = false;
  });
}

/* ---------- Tek tık çal / durdur ---------- */
async function sesToggle(m){
  if(calan && calan.id === m.id){
    calan.audio.pause(); calan = null;
    document.querySelectorAll(".playBtn").forEach(b=>b.textContent = "▶ Dinle");
    toast("Durduruldu");
    return;
  }
  if(calan){ calan.audio.pause(); calan = null; }
  let url = sunucuSesURL[m.id] || null;
  if(!url){
    const blob = await idb.get(m.id);
    if(!blob){ toast("Ses kaydı bulunamadı."); return; }
    url = URL.createObjectURL(blob);
  }
  const a = new Audio(url);
  calan = {id:m.id, audio:a};
  a.onended = ()=>{ if(calan && calan.id===m.id) calan = null;
    document.querySelectorAll(".playBtn").forEach(b=>b.textContent = "▶ Dinle"); };
  a.play();
  document.querySelectorAll(".playBtn").forEach(b=>b.textContent = "▶ Dinle");
  const btn = document.querySelector(`[data-play="${m.id}"]`);
  if(btn) btn.textContent = "⏸ Durdur";
  toast(TIP_BILGI[m.tip].ikon + " " + TIP_BILGI[m.tip].ad + " dinleniyor — durdurmak için tekrar dokun");
}
function mesafeMetni(m){
  if(!pos) return "";
  const d = haversine(pos.lat,pos.lon,m.lat,m.lon);
  return d < 1000 ? " · " + Math.round(d) + " m yakında" : " · " + (d/1000).toFixed(1) + " km uzakta";
}

/* ---------- Liste ---------- */
function listeyiCiz(){
  const el = $("#markList");
  // Yakındakiler üstte: konuma göre sırala (konum yoksa en yeni üstte)
  const gecerli = [...marks].sort((a,b)=>{
    if(pos){
      return haversine(pos.lat,pos.lon,a.lat,a.lon) - haversine(pos.lat,pos.lon,b.lat,b.lon);
    }
    return b.zaman - a.zaman;
  });
  const badge = $("#listBadge");
  badge.style.display = gecerli.length ? "flex" : "none";
  badge.textContent = gecerli.length;
  if(!gecerli.length){
    el.innerHTML = `<div class="empty">Henüz not yok.<br><br>Yolda bir şey görürsen düğmeye bas,<br>konuş, bırak — yazı yazmak yok.</div>`;
    return;
  }
  el.innerHTML = "";
  gecerli.forEach(m=>{
    const b = TIP_BILGI[m.tip];
    const kalan = Math.max(0, Math.round((m.bitis - Date.now())/60000));
    const oran = Math.min(100, Math.max(0, (m.bitis - Date.now()) / (m.bitis - m.zaman) * 100));
    const d = document.createElement("div");
    d.className = "mark";
    d.innerHTML = `<div class="t">${b.ikon} ${b.ad}${m.sunucu ? ' <small style="color:var(--muted)">· ortak</small>' : ''}</div>
      <div class="m">${new Date(m.zaman).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})} bırakıldı${mesafeMetni(m)} · ${kalan>=60 ? Math.floor(kalan/60)+" sa "+(kalan%60)+" dk" : kalan+" dk"} kaldı</div>
      <div style="height:6px;border-radius:3px;background:var(--border);margin-top:8px;overflow:hidden">
        <div style="height:100%;width:${oran}%;background:${b.renk}"></div>
      </div>
      <div class="row">
        <button class="playBtn" data-play="${m.id}">${calan && calan.id===m.id ? "⏸ Durdur" : "▶ Dinle"}</button>
        <button class="goBtn">🧭 Git</button>
        <button class="delBtn">Sil</button>
      </div>`;
    d.querySelector(".playBtn").onclick = ()=> sesToggle(m);
    d.querySelector(".goBtn").onclick = ()=>{ mapSetView(m.lat, m.lon, 16); $("#panel").classList.remove("open"); };
    d.querySelector(".delBtn").onclick = ()=> isaretSil(m.id);
    el.appendChild(d);
  });
}

/* ---------- Araç seçimi ---------- */
function aracEkraniKur(){
  const g = $("#vGrid");
  g.innerHTML = "";
  Object.keys(ARACLAR).forEach(k=>{
    const a = ARACLAR[k];
    const d = document.createElement("button");
    d.className = "vCard" + (arac === k ? " sel" : "");
    d.innerHTML = `<span class="ico">${a.ikon}</span>${a.ad}`;
    d.onclick = ()=>{
      arac = k; store.set("arac", k);
      $("#vehicleScreen").classList.remove("on");
      $("#limitLbl").textContent = "LİMİT · " + a.ad.toUpperCase();
      roadLimit = null; lastLimitFetch = 0; lastFetchPos = null;
      toast(a.ikon + " " + a.ad + " seçildi — limitler bu araca göre");
    };
    g.appendChild(d);
  });
}
function aracEkraniGoster(){ aracEkraniKur(); $("#vehicleScreen").classList.add("on"); }

/* ---------- Olaylar ---------- */
$("#limitBox").onclick = aracEkraniGoster;
$("#btnAcc").onclick   = ()=> kayitBaslat("kaza");
$("#btnVoice").onclick = ()=> kayitBaslat("ses");
$("#btnRest").onclick  = ()=> kayitBaslat("mola");
$("#btnCenter").onclick = ()=>{ if(pos) mapSetView(pos.lat, pos.lon, 16); };
$("#btnList").onclick = ()=> $("#panel").classList.add("open");
$("#btnClose").onclick = ()=> $("#panel").classList.remove("open");
$("#btnTheme").onclick = ()=>{
  const light = document.body.classList.toggle("light");
  $("#btnTheme").textContent = light ? "🌙" : "☀️";
  store.set("tema", light ? "acik" : "koyu");
};
document.querySelectorAll(".chip").forEach(c=>{
  c.classList.toggle("sel", +c.dataset.min === durMin);
  c.onclick = ()=>{
    document.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");
    durMin = +c.dataset.min;
    store.set("sure_dk", durMin);
    toast(`Yeni notlar ${durMin>=60 ? durMin/60+" saat" : durMin+" dakika"} kalacak`);
  };
});

/* ---------- Başlangıç ---------- */
(async function init(){
  if(store.get("tema","koyu") === "acik"){ document.body.classList.add("light"); $("#btnTheme").textContent = "🌙"; }
  if(arac && ARACLAR[arac]){ $("#limitLbl").textContent = "LİMİT · " + ARACLAR[arac].ad.toUpperCase(); }
  else { arac = "kamyon"; aracEkraniGoster(); }
  try{ await idb.open(); }catch(e){}
  sureKontrol();
  const ok = YANDEX_API_KEY ? await initYandex() : false;
  if(!ok){ useYandex = false; initOSM(); }
  marks.forEach(haritayaIsaret);
  listeyiCiz();
  gpsBaslat();
  if(SUNUCU_URL){ senkronCek(); setInterval(senkronCek, 25000); }
  setInterval(sureKontrol, 30000);
  setInterval(listeyiCiz, 60000);
})();
</script>
